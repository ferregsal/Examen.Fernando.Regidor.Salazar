<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoT</title>
    <link rel="shortcut icon" href="./favicon-32x32.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="./index.js" type="module" defer></script>
  </head>

  <body>
    <li class="character">
      <div class="card character__card">
        <img src="./assets/images/icon-star.svg" alt="icon-star" class="icon" />
        <div class="card-body">
          <h2 class="question">¿Cómo lo hicimos?</h2>
          <p class="description-text">
            Por favor, haznos saber cómo lo hicimos con tu solicitud de soporte.
            Todos los comentarios son bienvenidos para ayudarnos a mejorar
            nuestra oferta!
          </p>
          <div class="rating-radio-buttons">
            <ul>
              <li><input type="radio" id="html" name="1" value="HTML" /></li>
              <li><input type="radio" id="html" name="2" value="HTML" /></li>
              <li><input type="radio" id="html" name="3" value="HTML" /></li>
              <li><input type="radio" id="html" name="4" value="HTML" /></li>
              <li><input type="radio" id="html" name="5" value="HTML" /></li>
            </ul>
          </div>
          <div class="character__overlay">
            <ul>
              <li>Años de reinado: X</li>
              <li>Arma: XXX</li>
              <li>Destreza: X</li>
              <li>Peloteo: X</li>
              <li>Asesora a: X</li>
              <li>Sirve a: X</li>
            </ul>
            <div class="character__actions">
              <button class="character__action">habla</button>
              <button class="character__action">muere</button>
            </div>
          </div>
        </div>
        <i class="emoji"></i>
      </div>
    </li>
    `
  </body>
</html>
